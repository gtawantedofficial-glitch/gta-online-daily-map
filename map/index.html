<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTA Wanted — интерактивная карта</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#111827;color:#f3f4f6;font:16px Arial,sans-serif}
header{padding:16px;background:#1f2937}
h1{font-size:22px;margin:0 0 8px}
p{margin:0;color:#cbd5e1;font-size:14px}
#map{height:70vh;min-height:400px;background:#253247}
#status{padding:14px;color:#cbd5e1}
footer{padding:12px;font-size:13px;color:#94a3b8}
</style>
</head>
<body>
<header>
<h1>GTA Wanted — карта GTA V</h1>
<p>Перемещай карту мышкой, приближай колёсиком или кнопками + и −.</p>
</header>
<div id="map"></div>
<div id="status">Загружаем карту…</div>
<footer>Интерактивная основа. Ежедневные точки появятся после проверки координат.</footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const status = document.getElementById('status');
if (!window.L) {
  status.textContent = 'Не удалось загрузить Leaflet. Проверь подключение к интернету.';
} else {
  const CRS = L.extend({}, L.CRS.Simple, {
  transformation: new L.Transformation(1/32, 0, 1/32, 0)
});
const map = L.map('map', {crs: CRS, minZoom: 0, maxZoom: 5});
  const bounds = [[0,0],[256,256]];
  L.tileLayer('https://viruxe.github.io/gtav-map-tiles/satelite/{z}/{x}-{y}.webp', {
  minZoom: 0,
  maxZoom: 5,
  noWrap: true,
  bounds: [[0, 0], [256, 256]],
  attribution: 'GTA V map tiles'
}).addTo(map);
  map.fitBounds(bounds);
  status.textContent = 'Карта открыта. Если тайлы не появились, источник может использовать другую структуру или формат файлов.';
}
</script>
</body>
</html>
